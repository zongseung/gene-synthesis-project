<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HanMed · 동의보감 음성 자비스</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     동의보감 음성 자비스 — 홀로그램 비주얼 (Step A: 독립 HTML)
     Python 백엔드 없이 브라우저에서 바로 열어 비주얼을 다듬는 단계.
     상태 전환은 하단 디버그 버튼으로 테스트한다.
     Step C 에서 window.hologram.setState / pushLevel 을 Python 이 호출.
     ───────────────────────────────────────────────────────────── */
  :root {
    --cyan:        #5fe8ff;
    --cyan-deep:   #19d7ff;
    --cyan-dark:   #0a7fa0;
    --bg-0:        #03070a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%,
                #0a1a24 0%, #050d12 55%, var(--bg-0) 100%);
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: var(--cyan);
    user-select: none;
  }

  /* ── HUD 프레임 (코너 브래킷 + 타이틀) ──────────────────────── */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud-corner {
    position: absolute; width: 26px; height: 26px;
    border: 2px solid var(--cyan-deep);
    opacity: 0.55; filter: drop-shadow(0 0 4px var(--cyan-deep));
  }
  .hud-corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; }
  .hud-corner.tr { top: 16px; right: 16px; border-left: 0;  border-bottom: 0; }
  .hud-corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; }
  .hud-corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; }
  .hud-title {
    position: absolute; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 11px; letter-spacing: 0.42em;
    color: var(--cyan); opacity: 0.7;
    text-shadow: 0 0 8px var(--cyan-deep);
  }

  /* ── 스테이지 (홀로그램 본체) ───────────────────────────────── */
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* 투영 광원 콘 (베이스 → 마스코트) */
  .cone {
    position: absolute; bottom: 30%;
    width: 300px; height: 280px;
    background: linear-gradient(to top,
                rgba(25,215,255,0.20), rgba(25,215,255,0.04) 60%, transparent 85%);
    clip-path: polygon(40% 100%, 60% 100%, 86% 0%, 14% 0%);
    filter: blur(4px);
    animation: cone-flicker 5s ease-in-out infinite;
  }
  @keyframes cone-flicker {
    0%,100% { opacity: 0.8; } 50% { opacity: 1; }
  }

  /* 마스코트 뒤 글로우 헤일로 */
  .halo {
    position: absolute;
    width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle,
                rgba(25,215,255,0.30) 0%, rgba(25,215,255,0.07) 45%, transparent 70%);
    filter: blur(6px);
    animation: halo-pulse 3.6s ease-in-out infinite;
  }
  @keyframes halo-pulse {
    0%,100% { transform: scale(0.96); opacity: 0.75; }
    50%     { transform: scale(1.05); opacity: 1; }
  }

  /* listening 상태의 펄스 링 */
  .ring {
    position: absolute; width: 300px; height: 300px;
    border: 2px solid var(--cyan-deep); border-radius: 50%;
    opacity: 0; box-shadow: 0 0 18px var(--cyan-deep), inset 0 0 18px var(--cyan-deep);
  }

  /* thinking 상태의 궤도 점 */
  .orbit {
    position: absolute; width: 340px; height: 340px;
    opacity: 0; animation: orbit-spin 2.4s linear infinite;
  }
  .orbit i {
    position: absolute; top: 50%; left: 50%;
    width: 7px; height: 7px; margin: -3.5px;
    background: var(--cyan); border-radius: 50%;
    box-shadow: 0 0 10px var(--cyan-deep);
  }
  .orbit i:nth-child(1) { transform: rotate(0deg)   translateX(170px); }
  .orbit i:nth-child(2) { transform: rotate(120deg) translateX(170px); }
  .orbit i:nth-child(3) { transform: rotate(240deg) translateX(170px); }
  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  /* 마스코트 거북이 */
  .turtle-wrap {
    position: relative; width: 280px; height: 280px;
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  .turtle {
    width: 100%; height: 100%;
    image-rendering: pixelated;
    opacity: 0.94;
    filter: drop-shadow(0 0 14px var(--cyan-deep))
            drop-shadow(0 0 30px var(--cyan-dark))
            brightness(1.08);
  }
  /* 사이안 홀로그램 틴트 — 픽셀아트 디테일은 유지하면서 색만 입힘 */
  .turtle-wrap::after {
    content: ""; position: absolute; inset: 0;
    background: var(--cyan-deep);
    mix-blend-mode: color; opacity: 0.32;
    -webkit-mask: url(turtle_idle.png) center/contain no-repeat;
            mask: url(turtle_idle.png) center/contain no-repeat;
    pointer-events: none;
  }

  /* 투영 베이스 디스크 */
  .base {
    position: absolute; bottom: 28%;
    width: 250px; height: 40px; border-radius: 50%;
    background: radial-gradient(ellipse,
                rgba(31,224,255,0.55), rgba(31,224,255,0.10) 60%, transparent 75%);
    box-shadow: 0 0 50px 10px rgba(31,224,255,0.30);
    animation: base-pulse 3.6s ease-in-out infinite;
  }
  @keyframes base-pulse {
    0%,100% { opacity: 0.8; transform: scaleX(0.96); }
    50%     { opacity: 1;   transform: scaleX(1.04); }
  }

  /* ── 오디오 파형 ───────────────────────────────────────────── */
  .waveform {
    position: absolute; bottom: 15%;
    left: 50%; transform: translateX(-50%);   /* 가로 중앙 정렬 */
    display: flex; align-items: flex-end; gap: 4px; height: 56px;
  }
  .waveform i {
    width: 5px; height: 5px; border-radius: 2px;
    background: linear-gradient(to top, var(--cyan-dark), var(--cyan));
    box-shadow: 0 0 6px var(--cyan-deep);
    transition: height 0.06s linear;
  }

  /* ── 인식 텍스트 / 답변 텍스트 표시 ─────────────────────────── */
  .transcript {
    position: absolute; top: 11%;
    left: 0; right: 0; margin: 0 auto;        /* 가로 중앙 정렬 */
    max-width: 82%; max-height: 42%; overflow-y: auto;
    text-align: center; white-space: pre-wrap;
    font-size: 12px; line-height: 1.55; color: var(--cyan);
    opacity: 0.78; min-height: 1.4em;
    text-shadow: 0 0 8px var(--cyan-dark);
  }

  /* ── 상태 라벨 ─────────────────────────────────────────────── */
  .status {
    position: absolute; bottom: 9%;
    left: 0; right: 0; text-align: center;    /* 가로 중앙 정렬 */
    font-size: 13px; letter-spacing: 0.46em; text-indent: 0.46em;
    color: var(--cyan); text-shadow: 0 0 10px var(--cyan-deep);
  }
  .status::before { content: "◦ "; opacity: 0.7; }
  .status::after  { content: " ◦"; opacity: 0.7; }

  /* ── 오버레이: 스캔라인 · 비네팅 · 플리커 ───────────────────── */
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom,
                transparent 0px, transparent 2px,
                rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px);
    animation: scan 7s linear infinite;
  }
  @keyframes scan { from { background-position-y: 0; } to { background-position-y: 120px; } }

  .scanbeam {
    position: fixed; left: 0; right: 0; height: 90px; pointer-events: none; z-index: 51;
    background: linear-gradient(to bottom,
                transparent, rgba(95,232,255,0.07) 50%, transparent);
    animation: beam 6s linear infinite;
  }
  @keyframes beam { from { top: -90px; } to { top: 100%; } }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 52;
    background: radial-gradient(ellipse at center,
                transparent 52%, rgba(0,0,0,0.72) 100%);
  }
  .flicker {
    position: fixed; inset: 0; pointer-events: none; z-index: 53;
    background: var(--cyan-deep); opacity: 0; mix-blend-mode: overlay;
    animation: flick 7s steps(1) infinite;
  }
  @keyframes flick {
    0%,96%,100% { opacity: 0; }
    96.5%       { opacity: 0.05; }
    97.5%       { opacity: 0.02; }
    98.5%       { opacity: 0.06; }
  }

  /* ── 상태별 스타일 (data-state 로 제어) ─────────────────────── */
  .stage[data-state="listening"] .ring   { opacity: 1; animation: ring-pulse 1.6s ease-out infinite; }
  .stage[data-state="listening"] .halo   { animation-duration: 1.8s; }
  @keyframes ring-pulse {
    0%   { transform: scale(0.82); opacity: 0.9; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  .stage[data-state="thinking"] .orbit   { opacity: 1; }
  .stage[data-state="thinking"] .turtle-wrap { animation-duration: 2.4s; }
  .stage[data-state="speaking"] .halo    { animation-duration: 0.9s; }
  .stage[data-state="speaking"] .base    { animation-duration: 0.9s; }

  /* ── 디버그 컨트롤 (Step A 전용 — Step B 에서 숨김) ─────────── */
  .debug {
    position: fixed; bottom: 14px; left: 0; right: 0; z-index: 60;
    display: flex; justify-content: center; gap: 8px;
  }
  .debug button {
    background: rgba(10,127,160,0.15);
    border: 1px solid var(--cyan-dark);
    color: var(--cyan); font-family: inherit; font-size: 10px;
    letter-spacing: 0.15em; padding: 6px 12px; border-radius: 4px;
    cursor: pointer; transition: all 0.15s;
  }
  .debug button:hover  { background: rgba(31,224,255,0.25); }
  .debug button.active { background: rgba(31,224,255,0.35); box-shadow: 0 0 12px var(--cyan-deep); }
</style>
</head>
<body>

  <div class="hud">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="hud-title">HANMED · 東醫寶鑑 ASSISTANT</div>
  </div>

  <div class="stage" id="stage" data-state="idle">
    <div class="cone"></div>
    <div class="halo"></div>
    <div class="ring"></div>
    <div class="orbit"><i></i><i></i><i></i></div>
    <div class="turtle-wrap">
      <img class="turtle" id="turtle" src="turtle_idle.png" alt="거북 약사">
    </div>
    <div class="base"></div>
  </div>

  <div class="transcript" id="transcript"></div>
  <div class="waveform" id="waveform"></div>
  <div class="status" id="status">IDLE</div>

  <div class="scanlines"></div>
  <div class="scanbeam"></div>
  <div class="vignette"></div>
  <div class="flicker"></div>

  <div class="debug" id="debug">
    <button data-s="idle">IDLE</button>
    <button data-s="listening">LISTENING</button>
    <button data-s="thinking">THINKING</button>
    <button data-s="speaking">SPEAKING</button>
  </div>

<script>
  const stage      = document.getElementById('stage');
  const turtle     = document.getElementById('turtle');
  const statusEl   = document.getElementById('status');
  const waveform   = document.getElementById('waveform');
  const debug      = document.getElementById('debug');
  const transcript = document.getElementById('transcript');

  const FRAME = { idle: 'turtle_idle.png', blink: 'turtle_blink.png', talk: 'turtle_talk.png' };
  const LABEL = {
    idle:      '클릭하여 질문',
    listening: '듣는 중 · 다시 클릭하면 종료',
    thinking:  '생각하는 중',
    speaking:  '답변하는 중',
  };
  const BARS  = 36;

  let state     = 'idle';
  let talkTimer = null;
  let level     = 0;          // 외부(Step C)에서 주입할 오디오 레벨 0~1

  // 파형 막대 생성
  for (let i = 0; i < BARS; i++) waveform.appendChild(document.createElement('i'));
  const bars = [...waveform.children];

  // ── 상태 전환 ────────────────────────────────────────────────
  function setState(next) {
    state = next;
    stage.dataset.state = next;
    statusEl.textContent = LABEL[next] || next.toUpperCase();
    [...debug.children].forEach(b => b.classList.toggle('active', b.dataset.s === next));

    clearInterval(talkTimer);
    if (next === 'speaking') {
      // 말하는 중 — 입 뻐끔 (talk ↔ idle 프레임 토글)
      let open = false;
      talkTimer = setInterval(() => {
        open = !open;
        turtle.src = open ? FRAME.talk : FRAME.idle;
      }, 150);
    } else {
      turtle.src = FRAME.idle;
    }
  }

  // ── idle/listening 중 자연스러운 깜빡임 ──────────────────────
  function scheduleBlink() {
    setTimeout(() => {
      if (state === 'idle' || state === 'listening') {
        turtle.src = FRAME.blink;
        setTimeout(() => {
          if (state === 'idle' || state === 'listening') turtle.src = FRAME.idle;
        }, 130);
      }
      scheduleBlink();
    }, 2200 + Math.random() * 3200);
  }
  scheduleBlink();

  // ── 파형 애니메이션 ──────────────────────────────────────────
  function animateWave() {
    const t = performance.now() / 1000;
    bars.forEach((b, i) => {
      const center = 1 - Math.abs(i - BARS / 2) / (BARS / 2);   // 가운데가 높게
      let h;
      if (state === 'speaking') {
        // level(외부 주입)이 있으면 반영, 없으면 mock
        const amp = level > 0 ? level : 0.5 + 0.5 * Math.random();
        h = 6 + Math.abs(Math.sin(t * 7 + i * 0.55)) * 48 * amp * (0.4 + center);
      } else if (state === 'listening') {
        h = 5 + Math.abs(Math.sin(t * 2.4 + i * 0.3)) * 16 * (0.5 + center);
      } else if (state === 'thinking') {
        h = 5 + Math.abs(Math.sin(t * 3.2 + i * 0.8)) * 11;
      } else {
        h = 4 + Math.abs(Math.sin(t * 1.1 + i * 0.25)) * 5;
      }
      b.style.height = h + 'px';
    });
    requestAnimationFrame(animateWave);
  }
  animateWave();

  // ── 디버그 버튼 ──────────────────────────────────────────────
  [...debug.children].forEach(btn => {
    btn.addEventListener('click', () => setState(btn.dataset.s));
  });

  // ── Step C 용 외부 API — Python 브리지가 호출 ────────────────
  window.hologram = {
    setState,                              // setState('listening') 등
    pushLevel: (v) => { level = Math.max(0, Math.min(1, v)); },  // 오디오 진폭 0~1
    setTranscript: (t) => { transcript.textContent = t || ''; }, // 인식 텍스트 표시
  };

  // ── pywebview 환경에서만 — 창 클릭 → Python 으로 녹음 토글 신호 ──
  // 일반 브라우저(Step A)에서는 window.pywebview 가 없어 아무 일도 안 일어남.
  document.body.addEventListener('click', (e) => {
    if (e.target.closest('.debug')) return;          // 디버그 버튼은 제외
    if (window.pywebview && window.pywebview.api && window.pywebview.api.click) {
      window.pywebview.api.click();
    }
  });

  // pywebview 앱에서는 디버그 버튼을 숨긴다 — 클릭 대상은 홀로그램뿐.
  window.addEventListener('pywebviewready', () => {
    debug.style.display = 'none';
  });

  setState('idle');
</script>
</body>
</html>
