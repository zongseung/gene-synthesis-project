# Test queries — fewshot 과 entity 겹치지 않게 의도적으로 다른 처방·증 조합
# ============================================================================
test_queries:
  - "두통이 있는데 사군자탕 먹어도 돼?"        # 사군자탕(보기) ↔ 두통: ✗ 예상
  - "어지러움이 잦은데 사물탕 어때?"            # 사물탕 ↔ 어지럼(혈허현훈): ✓ 가능
  - "기침이 잦은데 십전대보탕은?"              # 십전대보탕(보기보혈) ↔ 기침: ✗ 예상
