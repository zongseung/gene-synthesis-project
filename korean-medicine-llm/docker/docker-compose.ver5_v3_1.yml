# HanMed ver5 v3.1 merged serving.
#
# This is the backend used by the bare `hanmed` CLI:
#   endpoint: http://localhost:8000/v1
#   model:    hanmed-sft-ver5-v3-1
#
# GPU selection defaults to GPU 1 so the ver8.1 RAG stack can keep GPU 0.

services:
  hanmed_vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: hanmed-llm:v0.1
    container_name: hanmed_vllm
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${HANMED_VLLM_GPU:-1}"]
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${HANMED_VLLM_GPU:-1}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model=/model
      - --served-model-name=hanmed-sft-ver5-v3-1
      - --tokenizer=/model
      - --trust-remote-code
      - --dtype=bfloat16
      - --port=8000
      - --host=0.0.0.0
      - --max-model-len=4096
      - --max-num-seqs=16
      - --gpu-memory-utilization=0.85
      - --disable-log-requests
    volumes:
      - ${HANMED_MODEL_DIR:-../outputs/hanmed_merged_ver5_v3_1}:/model:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    shm_size: 8gb
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
