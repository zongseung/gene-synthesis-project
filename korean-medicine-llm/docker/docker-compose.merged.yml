# ver4 §03.01 · HanMed vLLM serving.
#
# 선결:
#   1. scripts/build_merged_model.py 로 merged 모델 빌드 (outputs/hanmed_merged_v0.1)
#   2. Docker daemon + nvidia-container-toolkit 동작
#
# 기동: docker compose up -d --build
# 상태: docker compose ps / docker compose logs -f hanmed_vllm
# 중지: docker compose down

services:
  hanmed_vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: hanmed-llm:v0.1
    container_name: hanmed_vllm
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model=/model
      - --served-model-name=hanmed-p-a-plus
      - --tokenizer=/model
      - --trust-remote-code
      - --dtype=bfloat16
      - --port=8000
      - --host=0.0.0.0
      - --max-model-len=4096
      - --max-num-seqs=16
      - --gpu-memory-utilization=0.85
      - --disable-log-requests
    volumes:
      - ${HANMED_MODEL_DIR:-../outputs/hanmed_merged_v0.1}:/model:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    shm_size: 8gb
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
