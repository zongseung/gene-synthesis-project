# ver4 §03.01 · HanMed vLLM serving — LoRA direct mode.
#
# 어댑터 교체 워크플로 (매 학습 이터레이션):
#   1. 새 어댑터 학습 완료 → outputs/cpt_bllossom_R{n}/adapter
#   2. ln -sfn cpt_bllossom_R{n}/adapter ../outputs/adapter_current
#   3. docker compose restart hanmed_vllm
#
# merged 모델 fallback 필요시:
#   docker compose -f docker-compose.merged.yml up -d
#
# 기동: docker compose up -d --build
# 상태: docker compose ps / docker compose logs -f hanmed_vllm
# 중지: docker compose down

services:
  hanmed_vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: hanmed-llm:v0.1
    container_name: hanmed_vllm
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model=MLP-KTLim/llama-3-Korean-Bllossom-8B
      - --tokenizer=/tokenizer
      - --served-model-name=hanmed-base
      - --enable-lora
      - --lora-modules=hanmed-p-a-plus=/adapter
      - --max-lora-rank=32
      - --max-loras=1
      - --lora-extra-vocab-size=256
      - --chat-template=/tokenizer/chat_template.jinja
      - --trust-remote-code
      - --dtype=bfloat16
      - --port=8000
      - --host=0.0.0.0
      - --max-model-len=4096
      - --max-num-seqs=16
      - --gpu-memory-utilization=0.85
      - --disable-log-requests
    volumes:
      - ${HF_HOME_HOST:-/home/user/.cache/huggingface}:/hf:ro
      - ${HANMED_ADAPTER_DIR:-../outputs/adapter_current}:/adapter:ro
      - ${HANMED_TOKENIZER_DIR:-../data/tokenizer/hanmed_bllossom_ext}:/tokenizer:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    shm_size: 8gb
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
