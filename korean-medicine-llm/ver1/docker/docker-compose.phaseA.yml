# ver4 §08 · HanMed Phase A' (동의보감 단일 책) vLLM serving — LoRA direct mode.
#
# Phase A' adapter (outputs/cpt_bllossom_phaseA/adapter) 를 base 위에 동적 로드.
# merged 모델 빌드 없이 adapter 파일만으로 서빙 가능.
#
# 기동:
#   cd docker && docker compose -f docker-compose.phaseA.yml up -d --build
# 상태:
#   docker compose -f docker-compose.phaseA.yml ps
#   docker compose -f docker-compose.phaseA.yml logs -f hanmed_vllm_phaseA
# 중지:
#   docker compose -f docker-compose.phaseA.yml down
#
# OpenAI 호환 endpoint:
#   curl http://localhost:8000/v1/models
#   curl http://localhost:8000/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model":"dongui-bogam","messages":[{"role":"user","content":"동의보감 편찬자는?"}]}'
#
# 어댑터 재학습 워크플로:
#   1. 새 학습 완료 → outputs/cpt_bllossom_phaseA_v{n}/adapter
#   2. export HANMED_ADAPTER_DIR=../outputs/cpt_bllossom_phaseA_v2/adapter
#   3. docker compose -f docker-compose.phaseA.yml restart

services:
  hanmed_vllm_phaseA:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    image: hanmed-llm:phaseA
    container_name: hanmed_vllm_phaseA
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model=MLP-KTLim/llama-3-Korean-Bllossom-8B
      - --tokenizer=/tokenizer
      - --served-model-name=hanmed-phaseA-base
      - --enable-lora
      - --lora-modules=dongui-bogam=/adapter
      - --max-lora-rank=32
      - --max-loras=1
      - --lora-extra-vocab-size=256
      - --chat-template=/tokenizer/chat_template.jinja
      - --trust-remote-code
      - --dtype=bfloat16
      - --port=8000
      - --host=0.0.0.0
      - --max-model-len=4096
      - --max-num-seqs=16
      - --gpu-memory-utilization=0.85
      - --disable-log-requests
    volumes:
      - ${HF_HOME_HOST:-/home/user/.cache/huggingface}:/hf:ro
      - ${HANMED_ADAPTER_DIR:-../outputs/cpt_bllossom_phaseA/adapter}:/adapter:ro
      - ${HANMED_TOKENIZER_DIR:-../data/tokenizer/hanmed_bllossom_ext}:/tokenizer:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    shm_size: 8gb
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
