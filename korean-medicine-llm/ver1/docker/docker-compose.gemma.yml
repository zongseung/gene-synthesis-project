# ver6 · Gemma-3 12B-IT zero-training probe serving.
#
# Model: google/gemma-3-12b-it (weights via unsloth/gemma-3-12b-it mirror)
# Local path: ../models/gemma-3-12b-it
#
# 기동:
#   cd docker && docker compose -f docker-compose.gemma.yml up -d
# 상태:
#   docker compose -f docker-compose.gemma.yml logs -f
# 중지:
#   docker compose -f docker-compose.gemma.yml down
#
# OpenAI 호환:
#   curl http://localhost:8000/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gemma-3-12b-it","messages":[{"role":"user","content":"동의보감 편찬자는?"}]}'

services:
  hanmed_vllm_gemma_probe:
    image: vllm/vllm-openai:v0.9.2
    container_name: hanmed_vllm_gemma_probe
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model=/model
      - --served-model-name=gemma-3-12b-it
      - --tokenizer=/model
      - --trust-remote-code
      - --dtype=bfloat16
      - --port=8000
      - --host=0.0.0.0
      - --max-model-len=8192
      - --max-num-seqs=8
      - --gpu-memory-utilization=0.85
      - --disable-log-requests
      - --enforce-eager
      # Gemma-3 is multimodal; disable vision to run as text-only
      - --limit-mm-per-prompt
      - image=0
    volumes:
      - ../models/gemma-3-12b-it:/model:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    shm_size: 8gb
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
