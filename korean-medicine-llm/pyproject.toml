[project]
name = "hanmed-llm"
version = "0.1.0"
description = "HanMed CLI — Korean medicine classics assistant (ver4 P-A+ CPT)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6.0",
  "transformers>=5.5.4",
  "peft>=0.13.2",
  "pyarrow>=23.0.1",
  "pandas>=3.0.2",
  "pillow>=12.2.0",
  "pyyaml>=6.0.1",
  "hanja>=0.15.1",
  "scikit-learn>=1.8.0",
  "numpy>=2.4.4",
  "timm>=1.0.27",
  "webdataset>=1.0.2",
  "datasets>=4.8.4",
  "openai>=2.36.0",
  "requests>=2.33.1",
  "safetensors>=0.7.0",
  "torchvision>=0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hanmed_mm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
