[project]
name = "hanmed-llm"
version = "0.1.0"
description = "HanMed CLI — Korean medicine classics assistant (ver4 P-A+ CPT)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "httpx>=0.27",
]

[project.scripts]
hanmed = "hanmed_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hanmed_cli*"]

[tool.setuptools.package-data]
"hanmed_cli.prompts" = ["*.ansi", "*.md"]
