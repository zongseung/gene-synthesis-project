# VARCO-VISION 한의학 멀티모달 SFT (Stage 2, 메인)
# 전략: claudedocs/training_strategy_hanmed.md §2단계 + §3 환각방지 규칙
# - 설진(tongue) + 약초(herb) 통합, 균형 샘플링으로 설진 노출 ~1/3
# - 비전인코더 동결, LLM=LoRA(rank64 rslora), projector 풀학습(modules_to_save)
# - epoch 1~3, 작은 LR, early stopping(val loss/perplexity)

base_model: models/VARCO-VISION-2.0-14B

# 데이터
tongue_train: data/sft/tongue_sft/tongue_sft_train.jsonl   # 4,769
tongue_val:   data/sft/tongue_sft/tongue_sft_val.jsonl     #   556
herb_train:   data/sft/mm_train_resolved.jsonl              # 36,240 (이미지 실재 행만)
herb_val:     data/sft/mm_val_resolved.jsonl                #  4,716

# 1차 텍스트 SFT replay (build_sft_text.py 산출물). 주석 처리하면 순수 멀티모달.
text_train:   data/sft/text_replay.jsonl                    #  4,000 (행 기준 8.8%)
text_val:     data/sft/text_val.jsonl

# 이미지 루트 (image 필드는 논리경로 → root 와 결합)
# 설진: image="shezhenv3/train/X.jpg" → {tongue_image_root}/{split}/images/X.jpg
tongue_image_root: "/home/user/gene-synthesis-project/shezhen_unzipped/shezhen datasets/shezhenv3-coco/shezhenv3-coco"
# 약초: image="151/001_칡/xxx.jpg" → {herb_image_root}/151/001_칡/xxx.jpg
#   full 학습 시 NAS 또는 WebDataset(data/shards) 사용. 로컬 staged 는 data/images.
herb_image_root: "data/images"
herb_shard_index: data/shards/herb_shard_index.json   # tar 샤드 직접 읽기(/ ↔ __ 해소)
herb_shard_dir: data/shards

output_dir: outputs/sft_varco

# 균형 샘플링: 설진:약초 = 1:9.2 불균형 → 설진 노출 목표 비율
tongue_target_frac: 0.34     # WeightedRandomSampler 로 epoch 당 설진 ~1/3 노출
text_target_frac: 0.088      # 1차 replay 노출(행 기준). herb 는 잔여 비율

# LoRA
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
use_rslora: true

# 학습
lr: 1.0e-5                   # SFT 작은 LR
weight_decay: 0.0
epochs: 2                    # 1~3 권장, 환각방지 위해 적게
micro_bs: 1
grad_accum: 16
warmup_ratio: 0.03
lr_scheduler: cosine
# D3 — Collator 가 실제로 강제하되 **텍스트 전용 행에만** 적용한다.
# 이미지 행 길이는 anyres 그리드가 정하므로(실측 중앙값 약초 2,319 / 설진 3,067, 최대 4,000+)
# 자르면 image 토큰 수가 어긋나 processor 가 ValueError 를 낸다.
max_seq_len: 1024            # 1차 replay 행 상한 (실측 중앙 128토큰)
logging_steps: 10
# eval 은 체크포인트 선택용이라 자주·전량으로 돌 이유가 없다.
# 300스텝·전량(6,085행)이면 1회 63분 × 9회 = 9.5시간으로 학습의 15~20%를 먹는다.
eval_steps: 700              # 총 2,808스텝 → eval 4회
save_steps: 700
val_max_rows: 1500           # 소스 비율 유지한 결정론적 부분표집 (eval 1회 약 15분)
save_total_limit: 2
grad_checkpointing: true

# early stopping
early_stopping_patience: 2

# 메모리: 14B bf16 + 멀티모달 anyres activation 은 단일 A6000(48GB) backward 에서 OOM.
# → 단일 GPU 학습은 4bit QLoRA 필수 (projector 는 llm_int8_skip 로 풀학습 유지).
#   bf16 풀정밀 SFT 를 원하면 2-GPU FSDP/sharding 필요(현 스크립트는 미지원, 후속).
# smoke test 로 4bit 경로 검증 완료. 실행 시 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True 권장.
load_4bit: true

seed: 42
