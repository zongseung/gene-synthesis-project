[project]
name = "gene-synthesis-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "glmpca>=0.1.0",
    "glmpca-fast>=0.1.2",
    "statsmodels>=0.14.6",
    "cyvcf2>=0.32.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pysam>=0.23.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "wandb>=0.19.0",
]

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pypdf>=6.10.2",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
