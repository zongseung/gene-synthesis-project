# ── 데이터 ──
data:
  gene_size: 24576
  num_channels: 4
  num_classes: 26
  test_ratio: 0.1
  normalize: true
  enforce_zeros: true
  dim_reduction_method: "glm_pca"
  preprocessing_metadata_path: "data/processed/preprocessing_metadata.json"
  normalization_stats_path: "data/processed/normalization_stats.pkl"
  zero_mask_path: "data/processed/zero_mask.pt"
  label_hierarchy_path: "data/processed/label_hierarchy.pkl"

# ── 모델 ──
model:
  name: "HybridCNNDiTFiLM"
  # CNN
  base_channels: 64
  channel_mult: [1, 1, 2, 2, 4]
  kernel_size: 3
  # DiT
  d_model: 256
  n_dit_blocks: 4
  n_heads: 4
  mlp_ratio: 4.0
  dropout: 0.1
  # Patch
  patch_size: 16
  # Population
  n_pops: 26
  n_superpops: 5

# ── Diffusion ──
diffusion:
  max_timesteps: 1000
  noise_schedule: "linear"
  prediction_target: "epsilon"
  sample_clip: 6.0
  guidance_type: "classifier_free"
  guidance_weight: 0.0
  cfg_dropout_rate: 0.1
  sampling_timesteps: 100
  ddim_eta: 0.5

# ── 학습 ──
training:
  epochs: 500
  batch_size: 16
  lr: 0.0002
  seed: 20260327
  weight_decay: 0.0001
  optimizer: "adamw"
  gradient_clipping: 1.0
  warmup_steps: 100
  ema_decay: 0.999
  precision: "bf16"              # bf16 부동소수점
  save_every: 20                 # checkpoint 저장 주기

# ── 실험 운영 ──
experiment:
  run_name: "20260915_glm_pca_baseline"
  tags: ["hybrid-genodit", "glm-pca", "baseline", "adaln-zero"]
  save_top_k_checkpoints: 3

# ── DDP ──
distributed:
  backend: "nccl"
  num_gpus: 2

# ── 저장 ──
save_dir: "outputs/20260915_glm_pca_baseline"
