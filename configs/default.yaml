# ── 데이터 ──
data:
  gene_size: 24576
  num_channels: 8
  num_classes: 26
  num_superpops: 5
  num_samples: 2504
  test_ratio: 0.1
  split_seed: 20260327
  normalize: true
  enforce_zeros: true
  zero_mask_path: "data/processed/zero_mask.pt"
  label_hierarchy_path: "data/processed/label_hierarchy.pkl"
  split_manifest_path: "data/processed/split_manifest.json"

# ── 모델 ──
model:
  name: "HybridCNNDiTFiLM"
  # CNN
  base_channels: 128
  channel_mult: [1, 1, 2, 2, 4]
  kernel_size: 3
  # DiT
  d_model: 512
  n_dit_blocks: 12
  n_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  # Patch
  patch_size: 16
  # Population
  n_pops: 26
  n_superpops: 5

# ── Diffusion ──
diffusion:
  max_timesteps: 1000
  noise_schedule: "cosine"
  prediction_target: "epsilon"
  guidance_type: "classifier_free"
  guidance_weight: 3.0
  cfg_dropout_rate: 0.1
  sampling_timesteps: 100

# ── 학습 ──
training:
  epochs: 100                    # 조기종료 없이 전체 실행
  batch_size: 16
  lr: 0.0002
  seed: 20260327
  weight_decay: 0.0001
  optimizer: "adamw"
  gradient_clipping: 1.0
  warmup_steps: 100
  precision: "bf16"              # bf16 부동소수점
  save_every: 20                 # checkpoint 저장 주기

# ── 실험 운영 ──
experiment:
  run_name: "20260327_baseline_seed20260327"
  tags: ["baseline", "hybrid-genodit"]
  save_top_k_checkpoints: 3
  export_policy: "internal_only"

# ── DDP ──
distributed:
  backend: "nccl"
  num_gpus: 2

# ── 보조 손실 ──
aux_loss:
  enabled: false
  lambda_pca_dist: 0.01
  lambda_pop_structure: 0.01
  type: "mmd_rbf"
  warmup_epochs: 20

# ── 저장 ──
save_dir: "outputs/default"
